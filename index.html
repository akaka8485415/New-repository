<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>欧展仪 ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#030308;
    overflow:hidden;
    font-family:"Microsoft YaHei";
}


canvas{
    position:absolute;
}


.center-heart{

position:absolute;
top:35%;
width:100%;
text-align:center;
font-size:90px;

animation:beat 1.2s infinite;

filter:
drop-shadow(0 0 15px #ff0088)
drop-shadow(0 0 50px #ff66cc);

transition:1s;

}



@keyframes beat{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.25);
}

}



.text{

position:absolute;
top:62%;
width:100%;
text-align:center;

font-size:45px;
font-weight:bold;

color:#ff8cdb;

opacity:0;

transition:3s;

text-shadow:
0 0 10px #ff0099,
0 0 40px #ff66cc;

}



.text span{

font-size:25px;
letter-spacing:8px;

}



.show{

opacity:1;

animation:text 2s infinite alternate;

}


@keyframes text{

from{
transform:scale(1);
}

to{
transform:scale(1.08);
}

}



</style>

</head>


<body>


<canvas id="canvas"></canvas>



<div class="center-heart" id="heart">

❤️

</div>



<div class="text" id="love">

欧展仪 ❤️<br>

我喜欢你<br>

<span>Forever Love</span>

</div>



<script>


let canvas=document.getElementById("canvas");

let ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



let particles=[];

let stars=[];



// 粒子爱心公式

function heart(t){

let x=16*Math.pow(Math.sin(t),3);

let y=
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);


return {

x:x*15,

y:-y*15

};

}



// 创建粒子


for(let i=0;i<2200;i++){


let t=Math.random()*Math.PI*2;

let p=heart(t);



particles.push({

x:canvas.width/2,

y:canvas.height/2,

tx:canvas.width/2+p.x,

ty:canvas.height/2+p.y,

size:Math.random()*2+1,

a:Math.random(),

speed:0.02+Math.random()*0.03

});


}



// 动画


function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



particles.forEach(p=>{


p.x+=(p.tx-p.x)*p.speed;

p.y+=(p.ty-p.y)*p.speed;


p.a+=0.03;


if(p.a>1)
p.a=0;



ctx.beginPath();


ctx.fillStyle=
"rgba(255,50,160,"+p.a+")";


ctx.shadowBlur=20;

ctx.shadowColor="#ff0088";


ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);


ctx.fill();


});




// 爆炸星光


stars.forEach((s,i)=>{


s.x+=s.dx;

s.y+=s.dy;

s.a-=0.02;


ctx.beginPath();

ctx.fillStyle=
"rgba(255,120,220,"+s.a+")";


ctx.arc(
s.x,
s.y,
s.size,
0,
Math.PI*2
);


ctx.fill();


if(s.a<=0)
stars.splice(i,1);


});



requestAnimationFrame(draw);

}


draw();





// 点击效果


canvas.onclick=function(){



document
.getElementById("love")
.classList.add("show");



document
.getElementById("heart")
.style.transform="scale(0)";




// 爱心爆炸


particles.forEach(p=>{


let angle=Math.random()*Math.PI*2;


p.tx += Math.cos(angle)*400;

p.ty += Math.sin(angle)*400;


});



// 星光


for(let i=0;i<300;i++){


stars.push({

x:canvas.width/2,

y:canvas.height/2,

dx:(Math.random()-0.5)*10,

dy:(Math.random()-0.5)*10,

size:Math.random()*4+1,

a:1

});


}



};


</script>


</body>
</html>
