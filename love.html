<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我爱你 欧展仪 ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle,#700000,#000);

font-family:"Microsoft YaHei";

}


/* =================
   满屏漂浮文字
================= */

.loveText{

position:absolute;

color:#ff3355;

font-weight:bold;

white-space:nowrap;

opacity:.75;

text-shadow:

0 0 10px red,

0 0 30px #ff99aa;


animation:floatText 8s ease-in-out infinite;

}


@keyframes floatText{


0%{

transform:
translateY(110vh);

opacity:0;

}


20%{

opacity:1;

}


50%{

transform:
translateY(50vh)
translateX(40px);

}


80%{

opacity:1;

}


100%{

transform:
translateY(-20vh)
translateX(-40px);

opacity:0;

}


}





/* =================
   中间3D爱心
================= */


.box{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

perspective:800px;

}



.heart{


width:180px;

height:180px;

background:#ff0033;

position:relative;

transform:
rotate(-45deg);

cursor:pointer;


animation:

rotateHeart 4s linear infinite,

beat 1s infinite;


box-shadow:

0 0 30px red,

0 0 80px #ff3366,

0 0 120px pink;


}



.heart:before,
.heart:after{


content:"";

position:absolute;

width:180px;

height:180px;

background:#ff0033;

border-radius:50%;


}



.heart:before{

top:-90px;

}


.heart:after{

left:90px;

}




@keyframes rotateHeart{


0%{

transform:
rotateY(0deg)
rotate(-45deg);

}


100%{

transform:
rotateY(360deg)
rotate(-45deg);

}


}



@keyframes beat{


50%{

scale:1.2;

}


}




/* 名字 */


.name{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);


z-index:10;

color:white;

font-size:38px;

font-weight:bold;


text-shadow:

0 0 10px white,

0 0 30px red;


}




/* =================
   情书
================= */


.letter{


display:none;

position:absolute;

width:360px;

padding:30px;

top:50%;

left:50%;


transform:
translate(-50%,-50%);


background:
rgba(255,245,245,.96);


border-radius:20px;


color:#d60033;


font-size:20px;

line-height:2;


box-shadow:

0 0 50px red;


z-index:20;


}



.letter h2{

text-align:center;

}



/* =================
   爆炸爱心
================= */


.fly{


position:absolute;

font-size:35px;

animation:boom 2s forwards;


}



@keyframes boom{


0%{

opacity:1;

}


100%{


transform:
translate(
var(--x),
var(--y)
)
scale(0);


opacity:0;


}


}





.tip{

position:absolute;

bottom:50px;

width:100%;

text-align:center;

color:white;

font-size:20px;

}



</style>

</head>



<body>


<!-- 爱心 -->

<div class="box">

<div class="heart" onclick="openLove()"></div>

</div>



<div class="name">

❤️ 欧展仪 ❤️

</div>



<div class="tip">

点击爱心打开情书 💌

</div>




<!-- 情书 -->


<div class="letter" id="letter">

<h2>💌 给欧展仪</h2>

<p id="words"></p>


</div>





<script>


// 满屏文字

let words=[

"我爱你 欧展仪 ❤️",

"欧展仪 我喜欢你 ❤️",

"欧展仪 永远幸福 ❤️",

"遇见你是我的幸运 ❤️",

"我的心只属于你 ❤️"

];



setInterval(()=>{


let t=document.createElement("div");


t.className="loveText";


t.innerHTML=
words[
Math.floor(Math.random()*words.length)
];


t.style.left=
Math.random()*90+"%";


t.style.fontSize=
18+
Math.random()*25
+"px";


t.style.animationDuration=
6+
Math.random()*6
+"s";



document.body.appendChild(t);



setTimeout(()=>{

t.remove();

},12000);



},300);







// 点击爱心


function openLove(){


document.querySelector(".box").style.display="none";

document.querySelector(".name").style.display="none";

document.querySelector(".tip").style.display="none";



document.getElementById("letter")
.style.display="block";




// 爱心爆炸

for(let i=0;i<120;i++){


let h=document.createElement("div");


h.className="fly";


h.innerHTML="❤️";


h.style.left="50%";

h.style.top="50%";


h.style.setProperty(
"--x",
(Math.random()*900-450)+"px"
);


h.style.setProperty(
"--y",
(Math.random()*900-450)+"px"
);



document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},2000);



}





// 打字情书


let text=

"欧展仪 ❤️\n\n"+
"很幸运能够遇见你。\n\n"+
"你的出现，让平凡的日子变得特别。\n\n"+
"希望未来的每一天，\n"+
"都能看到你的笑容。\n\n"+
"无论春夏秋冬，\n"+
"我的心里一直都有你。\n\n"+
"我爱你 ❤️";



let i=0;

let box=document.getElementById("words");



function typing(){


if(i<text.length){


box.innerHTML +=

text[i]=="\n"
?
"<br>"
:
text[i];


i++;


setTimeout(
typing,
100
);


}


}



typing();



}



</script>


</body>
</html>
